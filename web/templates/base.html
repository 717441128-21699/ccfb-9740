<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or '医药挂网价格采集控制台' }}</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--line:#e3e8ef;--txt:#1f2937;--muted:#6b7280;
--brand:#1d4ed8;--ok:#047857;--warn:#b45309;--crit:#b91c1c;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font:14px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}
header{background:#0f172a;color:#fff;padding:14px 24px;display:flex;
align-items:center;gap:24px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
nav a{color:#cbd5e1;text-decoration:none;margin-right:16px;white-space:nowrap}
nav a:hover{color:#fff}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:16px}
.card .num{font-size:26px;font-weight:700}
.card .lbl{color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);
border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;
vertical-align:top}
th{background:#f1f5f9;font-weight:600}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
.tag.ok{background:#d1fae5;color:var(--ok)}
.tag.warn{background:#fef3c7;color:var(--warn)}
.tag.crit{background:#fee2e2;color:var(--crit)}
.tag.gray{background:#e5e7eb;color:#374151}
button,.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;
padding:7px 14px;cursor:pointer;font-size:13px;text-decoration:none;
display:inline-block}
button.secondary{background:#475569}
button.danger{background:var(--crit)}
form.inline{display:inline}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;align-items:center}
input,select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;
font-size:13px}
.muted{color:var(--muted)}
.section-title{margin:24px 0 10px;font-size:16px}
.log{font-family:Consolas,monospace;font-size:12px;background:#0f172a;
color:#a7f3d0;border-radius:10px;padding:12px;max-height:340px;overflow:auto}
.log .err{color:#fca5a5}.log .warn{color:#fcd34d}
.pending-box{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;
padding:14px;margin-bottom:16px}
code{background:#eef2ff;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>医药挂网价格采集控制台</h1>
  <nav>
    <a href="{{ url_for('index') }}">总览</a>
    <a href="{{ url_for('platforms_page') }}">平台配置</a>
    <a href="{{ url_for('jobs_page') }}">采集任务</a>
    <a href="{{ url_for('drugs_page') }}">药品库</a>
    <a href="{{ url_for('changes_page') }}">价格变更</a>
    <a href="{{ url_for('alerts_page') }}">告警</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
